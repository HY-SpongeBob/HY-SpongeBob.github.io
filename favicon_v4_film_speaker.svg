<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SpongeBob body -->
  <rect x="16" y="16" width="32" height="36" rx="4" fill="#FFE135" stroke="#C8A800" stroke-width="1.5"/>
  <!-- Holes -->
  <circle cx="22" cy="24" r="1.8" fill="#D4B800" opacity="0.35"/>
  <circle cx="38" cy="22" r="1.5" fill="#D4B800" opacity="0.35"/>
  <circle cx="25" cy="42" r="1.5" fill="#D4B800" opacity="0.35"/>
  <circle cx="40" cy="40" r="1.8" fill="#D4B800" opacity="0.35"/>
  <!-- Eyes -->
  <circle cx="27" cy="30" r="5" fill="white" stroke="#333" stroke-width="1.2"/>
  <circle cx="37" cy="30" r="5" fill="white" stroke="#333" stroke-width="1.2"/>
  <circle cx="28" cy="30" r="2.2" fill="#5BA3D9"/>
  <circle cx="38" cy="30" r="2.2" fill="#5BA3D9"/>
  <circle cx="28" cy="29.5" r="1" fill="#222"/>
  <circle cx="38" cy="29.5" r="1" fill="#222"/>
  <!-- Smile -->
  <path d="M25 39 Q32 45 39 39" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Film strip on left -->
  <rect x="2" y="20" width="10" height="28" rx="2" fill="#333" opacity="0.85"/>
  <rect x="4" y="23" width="6" height="4" rx="1" fill="#555"/>
  <rect x="4" y="30" width="6" height="4" rx="1" fill="#555"/>
  <rect x="4" y="37" width="6" height="4" rx="1" fill="#555"/>
  <!-- Speaker on right -->
  <circle cx="56" cy="34" r="8" fill="#333" opacity="0.85"/>
  <circle cx="56" cy="34" r="5" fill="#555"/>
  <circle cx="56" cy="34" r="2" fill="#c9a84c"/>
  <!-- Sound waves from speaker -->
  <path d="M60 28 Q63 34 60 40" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.6"/>
</svg>
