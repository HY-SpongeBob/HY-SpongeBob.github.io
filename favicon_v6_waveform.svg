<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimalist flat design -->
  <!-- Yellow square face -->
  <rect x="12" y="10" width="40" height="44" rx="6" fill="#FFD93D"/>
  <!-- Simple dot eyes -->
  <circle cx="26" cy="28" r="4" fill="#1a1a2e"/>
  <circle cx="38" cy="28" r="4" fill="#1a1a2e"/>
  <!-- Eye highlights -->
  <circle cx="27.5" cy="26.5" r="1.2" fill="white"/>
  <circle cx="39.5" cy="26.5" r="1.2" fill="white"/>
  <!-- Wide grin -->
  <path d="M22 38 Q32 48 42 38" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Waveform below (like audio editing) -->
  <g stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="8" y1="58" x2="8" y2="54"/>
    <line x1="14" y1="58" x2="14" y2="51"/>
    <line x1="20" y1="58" x2="20" y2="53"/>
    <line x1="26" y1="58" x2="26" y2="49"/>
    <line x1="32" y1="58" x2="32" y2="52"/>
    <line x1="38" y1="58" x2="38" y2="50"/>
    <line x1="44" y1="58" x2="44" y2="53"/>
    <line x1="50" y1="58" x2="50" y2="51"/>
    <line x1="56" y1="58" x2="56" y2="55"/>
  </g>
  <!-- Tiny music note top-right -->
  <g fill="#c9a84c" opacity="0.7">
    <circle cx="54" cy="8" r="2.5"/>
    <rect x="56" y="2" width="1.5" height="7"/>
  </g>
</svg>
