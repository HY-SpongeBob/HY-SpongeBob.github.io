<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Circular badge background -->
  <circle cx="32" cy="32" r="30" fill="#FFE135" stroke="#C9A84C" stroke-width="2"/>
  <!-- Inner shadow -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4B800" stroke-width="0.5" opacity="0.3"/>
  <!-- Eyes -->
  <circle cx="26" cy="28" r="5" fill="white" stroke="#333" stroke-width="1.2"/>
  <circle cx="38" cy="28" r="5" fill="white" stroke="#333" stroke-width="1.2"/>
  <circle cx="27" cy="28" r="2.2" fill="#5BA3D9"/>
  <circle cx="39" cy="28" r="2.2" fill="#5BA3D9"/>
  <circle cx="27" cy="27.5" r="1" fill="#222"/>
  <circle cx="39" cy="27.5" r="1" fill="#222"/>
  <!-- Smile -->
  <path d="M24 37 Q32 44 40 37" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="29" y="37" width="3" height="3.5" rx="0.8" fill="white" stroke="#ccc" stroke-width="0.4"/>
  <rect x="33" y="37" width="3" height="3.5" rx="0.8" fill="white" stroke="#ccc" stroke-width="0.4"/>
  <!-- Sound wave arcs on right -->
  <path d="M50 26 Q53 32 50 38" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M54 23 Q58 32 54 41" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Sound wave arcs on left -->
  <path d="M14 26 Q11 32 14 38" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M10 23 Q6 32 10 41" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
