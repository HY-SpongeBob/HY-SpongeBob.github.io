<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SpongeBob body -->
  <rect x="12" y="14" width="40" height="38" rx="5" fill="#FFE135" stroke="#C8A800" stroke-width="2"/>
  <!-- Holes -->
  <circle cx="20" cy="24" r="2.5" fill="#C8B800" opacity="0.5"/>
  <circle cx="38" cy="20" r="2" fill="#C8B800" opacity="0.5"/>
  <circle cx="28" cy="38" r="2.5" fill="#C8B800" opacity="0.5"/>
  <circle cx="42" cy="34" r="2" fill="#C8B800" opacity="0.5"/>
  <circle cx="18" cy="42" r="1.8" fill="#C8B800" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="26" cy="28" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="38" cy="28" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="27" cy="28" r="3" fill="#5BA3D9"/>
  <circle cx="39" cy="28" r="3" fill="#5BA3D9"/>
  <circle cx="27" cy="28" r="1.5" fill="#222"/>
  <circle cx="39" cy="28" r="1.5" fill="#222"/>
  <!-- Smile -->
  <path d="M24 38 Q32 46 40 38" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="29" y="38" width="3" height="4" rx="1" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <rect x="33" y="38" width="3" height="4" rx="1" fill="white" stroke="#ccc" stroke-width="0.5"/>
  <!-- Sound waves left -->
  <path d="M5 27 Q2 32 5 37" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M1 24 Q-3 32 1 40" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Sound waves right -->
  <path d="M59 27 Q62 32 59 37" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M63 24 Q67 32 63 40" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Small waveform bars at bottom -->
  <g stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="18" y1="60" x2="18" y2="56"/>
    <line x1="23" y1="60" x2="23" y2="54"/>
    <line x1="28" y1="60" x2="28" y2="55"/>
    <line x1="33" y1="60" x2="33" y2="53"/>
    <line x1="38" y1="60" x2="38" y2="55"/>
    <line x1="43" y1="60" x2="43" y2="54"/>
    <line x1="48" y1="60" x2="48" y2="57"/>
  </g>
</svg>
